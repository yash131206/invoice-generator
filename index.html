<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Invoice Maker — ShortBamboo</title>

<style>
:root{
  --bg:#eef0e8;
  --fg:#1a1d18;
  --card:#fff;
  --line:#d9dccf;
  --acc:#3f5d1f;
  --accfg:#fff;
  --mut:#666;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10120f;
    --fg:#eceee6;
    --card:#1a1d18;
    --line:#2f342a;
    --acc:#b6e36b;
    --accfg:#10120f;
    --mut:#9aa08f
  }
}

:root[data-theme="dark"]{
  --bg:#10120f;
  --fg:#eceee6;
  --card:#1a1d18;
  --line:#2f342a;
  --acc:#b6e36b;
  --accfg:#10120f;
  --mut:#9aa08f
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:14px
}

.wrap{
  max-width:820px;
  margin:0 auto
}

.bar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px
}

button{
  background:var(--acc);
  color:var(--accfg);
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font:600 14px inherit;
  font-family:inherit;
  cursor:pointer
}

button.ghost{
  background:transparent;
  color:var(--fg);
  border:1px solid var(--line)
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:1px
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:12px
}

.tabs button{
  flex:1
}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--acc);
  color:var(--accfg);
  padding:10px 16px;
  border-radius:8px;
  font-weight:600;
  display:none;
  z-index:9999;
  box-shadow:0 8px 25px rgba(0,0,0,.18)
}

.paper{
  background:#fff;
  color:#1a1d18;
  border-radius:10px;
  padding:28px
}

.paper input,
.paper textarea,
.paper select{
  font:inherit;
  color:#1a1d18;
  border:1px solid #ddd;
  border-radius:6px;
  padding:6px 8px;
  width:100%;
  background:#fafaf7
}

.paper textarea{
  resize:vertical;
  min-height:34px
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:3px solid #10120f;
  padding-bottom:14px
}

.brand{
  font-size:24px;
  font-weight:800
}

.brand small{
  display:block;
  font-size:12px;
  font-weight:400;
  color:#666
}

.title{
  font-size:28px;
  font-weight:800
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:18px 0
}

label{
  font-size:12px;
  color:#777;
  display:block;
  margin:8px 0 3px
}

table{
  width:100%;
  border-collapse:collapse
}

th{
  background:#10120f;
  color:#fff;
  font-size:12px;
  text-align:left;
  padding:8px
}

td{
  padding:6px 4px;
  border-bottom:1px solid #eee;
  vertical-align:top
}

.q{
  width:64px
}

.r{
  width:100px
}

.a{
  width:104px;
  text-align:right;
  padding-right:6px;
  font-weight:600
}

.x{
  width:40px
}

.x button{
  background:#eee;
  color:#333;
  padding:6px 10px
}

.tot{
  margin-left:auto;
  width:300px;
  margin-top:14px
}

.tot div{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 0;
  gap:8px
}

.tot select{
  width:96px
}

.tot .g{
  font-size:20px;
  font-weight:800;
  border-top:2px solid #10120f;
  margin-top:6px;
  padding-top:10px
}

.foot{
  margin-top:16px;
  font-size:12px;
  color:#777;
  text-align:center;
  border-top:1px solid #eee;
  padding-top:10px
}

.hint{
  font-size:12px;
  color:var(--mut);
  margin:8px 2px
}

#hist{
  display:none
}

.item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.item b{
  display:block
}

.item span{
  font-size:13px;
  color:var(--mut)
}

.item .btns{
  display:flex;
  gap:6px
}

.empty{
  padding:24px;
  text-align:center;
  color:var(--mut)
}

.sum{
  display:grid;
  grid-template-columns:minmax(120px,38%) 1fr;
  gap:12px;
  align-items:stretch;
  margin-top:14px
}

.sum .bank{
  min-width:0
}

.sum .tot{
  margin:0;
  width:auto;
  min-width:0
}

.bar input{
  flex:1 1 150px;
  min-width:0;
  background:var(--card);
  color:var(--fg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  font:inherit
}

.sum .bank{
  display:flex;
  flex-direction:column
}

.sum .bank textarea{
  flex:none;
  height:190px;
  min-height:34px
}

.qrbox{
  margin-top:10px
}

.mini{
  display:flex;
  gap:6px;
  margin-top:6px
}

.paper .mini button{
  background:#eef0e8;
  color:#3f5d1f;
  border:1px solid #d9dccf;
  padding:6px 10px;
  font-size:12px
}

.paper.pdf{
  background:#fff;
  color:#1a1d18
}

.paper.pdf .top{
  border-bottom-color:#3f5d1f
}

.paper.pdf .title{
  color:#3f5d1f
}

.paper.pdf .brand small,
.paper.pdf label,
.paper.pdf .foot{
  color:#6b7160
}

.paper.pdf th{
  background:#b6e36b;
  color:#10120f
}

.paper.pdf td{
  border-bottom-color:#e4e7da
}

.paper.pdf .tot .g{
  border-top-color:#3f5d1f;
  color:#3f5d1f
}

.paper.pdf .foot{
  border-top-color:#e4e7da
}

#qr{
  margin-top:10px
}

#qrcap{
  font-size:12px;
  color:#666;
  margin-top:4px
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }

  .paper{
    padding:14px
  }

  .tot{
    font-size:14px
  }

  .tot select{
    width:78px;
    padding:4px
  }

  .tot .g{
    font-size:17px
  }

  .sum{
    grid-template-columns:1fr
  }

  .sum .bank textarea{
    height:130px
  }
}

@media print{
  :root{
    padding:0
  }

  body{
    background:#fff;
    padding:0
  }

  .bar,
  .tabs,
  #hist,
  .toast,
  .x,
  .hint{
    display:none!important
  }

  .paper{
    border-radius:0;
    padding:0
  }

  .paper input,
  .paper textarea,
  .paper select{
    border:0;
    background:transparent;
    padding:2px 0;
    appearance:none;
    resize:none
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="tabs">
    <button id="tCreate" onclick="tab('create')">Create</button>
    <button id="tHist" class="ghost" onclick="tab('hist')">Saved invoices</button>
  </div>

  <div id="create">

    <div class="bar">
      <button onclick="addRow()">Add item</button>
      <button onclick="saveInvoice()">Save invoice</button>
      <button onclick="savePdf()">Save PDF</button>
      <button class="ghost" onclick="newInvoice()">New invoice</button>

      <input
        id="upi"
        data-remember
        placeholder="Your UPI ID"
        aria-label="Your UPI ID"
        oninput="calc()"
      >
    </div>

    <div class="paper">

      <div class="top">
        <div class="brand">
          ShortBamboo
          <small>Creator Marketing Agency · hello@shortbamboo.com</small>
        </div>

        <div class="title">INVOICE</div>
      </div>

      <div class="grid">

        <div>

          <label for="cname">Bill to</label>

          <input
            id="cname"
            list="clients"
            placeholder="Client or brand name"
            autocomplete="off"
            onchange="pickClient()"
          >

          <datalist id="clients"></datalist>

          <div class="mini nopdf">
            <button onclick="saveClient()">Save client</button>
            <button onclick="delClient(this)">Delete client</button>
          </div>

          <label for="caddr">Client address</label>
          <textarea id="caddr"></textarea>

          <label for="cgst">Client GSTIN</label>
          <input id="cgst">

          <label for="pan">Your PAN number</label>
          <input
            id="pan"
            data-remember
            maxlength="10"
            placeholder="ABCDE1234F"
            style="text-transform:uppercase"
          >

        </div>

        <div>

          <label for="no">Invoice no.</label>
          <input id="no" oninput="calc()">

          <label for="date">Invoice date</label>
          <input id="date" type="date">

          <label for="due">Due date</label>
          <input id="due" type="date">

          <label for="mgst">Your GSTIN</label>
          <input id="mgst" data-remember>

        </div>

      </div>

      <table>

        <thead>
          <tr>
            <th>Description</th>
            <th class="q">Qty</th>
            <th class="r">Rate (₹)</th>
            <th class="a">Amount</th>
            <th class="x"></th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>

      </table>

      <div class="sum">

        <div class="bank">

          <label for="pay">Payment details</label>

          <textarea
            id="pay"
            data-remember
            placeholder="Bank name, A/C no., IFSC"
          ></textarea>

        </div>

        <div class="tot">

          <div>
            <span>Subtotal</span>
            <span id="sub">₹0.00</span>
          </div>

          <div>
            <span>GST</span>

            <select id="gst" onchange="calc()">
              <option value="0">None</option>
              <option value="5">5%</option>
              <option value="12">12%</option>
              <option value="18">18%</option>
            </select>

            <span id="gstamt">₹0.00</span>
          </div>

          <div class="g">
            <span>Total</span>
            <span id="total">₹0.00</span>
          </div>

        </div>

      </div>

      <div class="nrow">

        <div class="nt">

          <label for="notes" style="margin-top:16px">
            Notes
          </label>

          <textarea id="notes" data-remember></textarea>

        </div>

        <div class="qrbox">

          <div id="qr"></div>
          <div id="qrcap"></div>

        </div>

      </div>

      <div class="foot">
        This is a computer-generated invoice.
      </div>

    </div>

    <p class="hint">
      GSTIN, payment details and notes are remembered on this device.
      Everything is stored in this browser only.
    </p>

  </div>

  <div id="hist"></div>

</div>

<div class="toast" id="toast"></div>

<!--
  Local libraries only.
  No external CDN requests are required for
  PDF generation or UPI QR generation.
-->
<script src="./vendor/html2pdf.bundle.min.js"></script>
<script src="./vendor/qrcode.min.js"></script>

<script>
const $ = id => document.getElementById(id);

const KEY = 'sb_invoice_v1';

let mem = null;

function read(){
  try{
    const s = localStorage.getItem(KEY);
    return s ? JSON.parse(s) : {};
  }catch(e){
    return mem || {};
  }
}

const db = Object.assign(
  {
    settings:{},
    counter:1,
    clients:{},
    invoices:[]
  },
  read()
);

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
  }catch(e){
    mem = db;
  }
}

const inr = n =>
  '₹' + Number(n || 0).toLocaleString(
    'en-IN',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

const isoDay = d =>
  new Date(
    d - d.getTimezoneOffset() * 60000
  ).toISOString().slice(0,10);

const autoNo = () =>
  'SB-' +
  new Date().getFullYear() +
  '-' +
  String(db.counter).padStart(3,'0');

function toast(m){

  const t = $('toast');

  t.textContent = m;
  t.style.display = 'block';

  clearTimeout(toast.h);

  toast.h = setTimeout(()=>{
    t.style.display = 'none';
  },1800);
}


/* =========================
   LINE ITEMS
========================= */

function addRow(d){

  d = d || {};

  const tr = document.createElement('tr');

  tr.innerHTML = `
    <td>
      <input
        class="d"
        placeholder="e.g. 5 creator reels"
      >
    </td>

    <td class="q">
      <input
        class="qt"
        type="number"
        min="0"
      >
    </td>

    <td class="r">
      <input
        class="rt"
        type="number"
        min="0"
      >
    </td>

    <td class="a">₹0.00</td>

    <td class="x">
      <button aria-label="Remove item">✕</button>
    </td>
  `;

  tr.querySelector('.d').value = d.d || '';

  tr.querySelector('.qt').value =
    d.q == null ? 1 : d.q;

  tr.querySelector('.rt').value =
    d.r == null ? 0 : d.r;

  tr.addEventListener('input',calc);

  tr.querySelector('.x button').onclick = ()=>{
    tr.remove();
    calc();
  };

  $('rows').appendChild(tr);

  calc();
}

function items(){

  return [
    ...document.querySelectorAll('#rows tr')
  ].map(tr => ({
    d:tr.querySelector('.d').value,
    q:+tr.querySelector('.qt').value || 0,
    r:+tr.querySelector('.rt').value || 0
  }));

}

function totals(it,g){

  const s = it.reduce(
    (a,x)=>a + x.q * x.r,
    0
  );

  const t = s * g / 100;

  return {
    s,
    t,
    all:s+t
  };
}

function calc(){

  document
    .querySelectorAll('#rows tr')
    .forEach(tr=>{

      const amount =
        (+tr.querySelector('.qt').value || 0) *
        (+tr.querySelector('.rt').value || 0);

      tr.querySelector('.a').textContent =
        inr(amount);

    });

  const T =
    totals(
      items(),
      +$('gst').value
    );

  $('sub').textContent = inr(T.s);
  $('gstamt').textContent = inr(T.t);
  $('total').textContent = inr(T.all);

  drawQr(T.all);
}


/* =========================
   REMEMBERED SETTINGS
========================= */

document
  .querySelectorAll('[data-remember]')
  .forEach(el=>{

    if(db.settings[el.id] != null){
      el.value = db.settings[el.id];
    }

    el.addEventListener('input',()=>{

      db.settings[el.id] = el.value;

      persist();

    });

  });

if(db.settings.notes == null){

  $('notes').value =
    'Payment due by the due date. Thank you for working with ShortBamboo.';

}


/* =========================
   CLIENTS
========================= */

function renderClients(){

  $('clients').innerHTML =
    Object.keys(db.clients)
      .map(n =>
        '<option value="' +
        n.replace(/"/g,'&quot;') +
        '">'
      )
      .join('');

}

function saveClient(){

  const n =
    $('cname').value.trim();

  if(!n){

    toast('Pehle client ka naam daalo');

    return;
  }

  db.clients[n] = {
    addr:$('caddr').value,
    gst:$('cgst').value
  };

  persist();
  renderClients();

  toast('Client saved');

}

function delClient(btn){

  const n =
    $('cname').value.trim();

  if(!db.clients[n]){

    toast('Ye client saved nahi hai');

    return;
  }

  if(!btn.dataset.arm){

    btn.dataset.arm = '1';
    btn.textContent = 'Tap again';

    setTimeout(()=>{
      btn.dataset.arm = '';
      btn.textContent = 'Delete client';
    },3000);

    return;
  }

  delete db.clients[n];

  persist();
  renderClients();

  btn.dataset.arm = '';
  btn.textContent = 'Delete client';

  toast('Client deleted');

}

function pickClient(){

  const c =
    db.clients[$('cname').value];

  if(c){

    $('caddr').value =
      c.addr || '';

    $('cgst').value =
      c.gst || '';

  }

}


/* =========================
   INVOICES
========================= */

function readForm(){

  return {
    no:$('no').value.trim(),
    date:$('date').value,
    due:$('due').value,
    cname:$('cname').value.trim(),
    caddr:$('caddr').value,
    cgst:$('cgst').value,
    gst:$('gst').value,
    items:items()
  };

}

function fillForm(o){

  $('no').value = o.no;
  $('date').value = o.date;
  $('due').value = o.due;
  $('cname').value = o.cname;
  $('caddr').value = o.caddr;
  $('cgst').value = o.cgst;
  $('gst').value = o.gst;

  $('rows').innerHTML = '';

  (
    o.items.length
      ? o.items
      : [{}]
  ).forEach(addRow);

  calc();

}

function newInvoice(){

  const t = new Date();

  fillForm({

    no:autoNo(),

    date:isoDay(t),

    due:isoDay(
      new Date(
        t.getTime() +
        7 * 864e5
      )
    ),

    cname:'',

    caddr:'',

    cgst:'',

    gst:'0',

    items:[{}]

  });

}

function saveInvoice(){

  const o = readForm();

  if(!o.no){

    toast(
      'Add an invoice number first'
    );

    return;
  }

  if(!o.cname){

    toast(
      'Add a client name first'
    );

    return;
  }

  const wasAuto =
    o.no === autoNo();

  const i =
    db.invoices.findIndex(
      x=>x.no === o.no
    );

  o.saved = Date.now();

  if(i >= 0){
    db.invoices[i] = o;
  }else{
    db.invoices.unshift(o);
  }

  db.clients[o.cname] = {
    addr:o.caddr,
    gst:o.cgst
  };

  if(wasAuto){
    db.counter++;
  }

  persist();
  renderClients();
  renderHist();

  toast(
    'Invoice ' +
    o.no +
    ' saved'
  );

}

function renderHist(){

  const h = $('hist');

  if(!db.invoices.length){

    h.innerHTML =
      '<div class="empty">' +
      'No saved invoices yet. ' +
      'Fill one in and tap Save invoice.' +
      '</div>';

    return;
  }

  h.innerHTML = '';

  db.invoices.forEach(o=>{

    const T =
      totals(
        o.items,
        +o.gst
      );

    const d =
      document.createElement('div');

    d.className = 'item';

    d.innerHTML = `
      <div>
        <b></b>
        <span></span>
      </div>

      <div class="btns">
        <button>Open</button>
        <button class="ghost">Delete</button>
      </div>
    `;

    d.querySelector('b').textContent =
      o.no + ' · ' + o.cname;

    d.querySelector('span').textContent =
      o.date + ' · ' + inr(T.all);

    const b =
      d.querySelectorAll('button');

    b[0].onclick = ()=>{
      fillForm(o);
      tab('create');
    };

    b[1].onclick = ()=>{

      if(!b[1].dataset.arm){

        b[1].dataset.arm = '1';
        b[1].textContent =
          'Tap again to delete';

        setTimeout(()=>{
          b[1].dataset.arm = '';
          b[1].textContent = 'Delete';
        },3000);

        return;
      }

      db.invoices =
        db.invoices.filter(
          x=>x !== o
        );

      persist();
      renderHist();

      toast('Invoice deleted');

    };

    h.appendChild(d);

  });

}

function tab(n){

  $('create').style.display =
    n === 'create'
      ? 'block'
      : 'none';

  $('hist').style.display =
    n === 'hist'
      ? 'block'
      : 'none';

  $('tCreate').className =
    n === 'create'
      ? ''
      : 'ghost';

  $('tHist').className =
    n === 'hist'
      ? ''
      : 'ghost';

  if(n === 'hist'){
    renderHist();
  }

}


/* =========================
   UPI QR
========================= */

let lastQr = null;

function upiLink(amt){

  const u =
    $('upi').value.trim();

  if(!u){
    return '';
  }

  return (
    'upi://pay?pa=' +
    encodeURIComponent(u).replace('%40','@') +
    '&pn=' +
    encodeURIComponent('ShortBamboo') +
    (amt > 0
      ? '&am=' + amt.toFixed(2)
      : '') +
    '&cu=INR&tn=' +
    encodeURIComponent(
      'Invoice ' +
      $('no').value.trim()
    )
  );

}

function drawQr(amt){

  const box = $('qr');
  const cap = $('qrcap');

  box.innerHTML = '';
  cap.textContent = '';

  lastQr = null;

  const link =
    upiLink(amt);

  if(
    !link ||
    typeof QRCode === 'undefined'
  ){
    return;
  }

  try{

    lastQr =
      new QRCode(
        box,
        {
          text:link,
          width:130,
          height:130,
          correctLevel:
            QRCode.CorrectLevel.M
        }
      );

    cap.textContent =
      amt > 0
        ? 'Scan to pay ' + inr(amt)
        : 'Scan to pay';

  }catch(e){

    console.error(
      'QR generation failed',
      e
    );

  }

}


/* =========================
   PDF HELPERS
========================= */

const esc = s =>
  String(
    s == null ? '' : s
  ).replace(
    /[&<>"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c])
  );

const nl = s =>
  esc(s).replace(
    /\n/g,
    '<br>'
  );

function qrDom(){

  if(
    !lastQr ||
    !lastQr._oQRCode
  ){
    return null;
  }

  const m =
    lastQr._oQRCode;

  const n =
    m.getModuleCount();

  const px =
    Math.max(
      2,
      Math.floor(150 / n)
    );

  const size =
    n * px;

  const w =
    document.createElement('div');

  w.style.cssText =
    'position:relative;' +
    'width:' + size + 'px;' +
    'height:' + size + 'px;' +
    'background:#fff';

  for(
    let r = 0;
    r < n;
    r++
  ){

    let c = 0;

    while(c < n){

      if(m.isDark(r,c)){

        let e = c;

        while(
          e < n &&
          m.isDark(r,e)
        ){
          e++;
        }

        const d =
          document.createElement('div');

        d.style.cssText =
          'position:absolute;' +
          'background:#000;' +
          'left:' + c * px + 'px;' +
          'top:' + r * px + 'px;' +
          'width:' + (e-c) * px + 'px;' +
          'height:' + px + 'px';

        w.appendChild(d);

        c = e;

      }else{

        c++;

      }

    }

  }

  return w;

}


/* =========================
   CLONE SAME UI FOR PDF
========================= */

function cloneForPdf(W){

  const src =
    document.querySelector('.paper');

  const c =
    src.cloneNode(true);

  c.classList.add('pdf');

  const se =
    src.querySelectorAll(
      'input,textarea,select'
    );

  c.querySelectorAll(
    'input,textarea,select'
  ).forEach((el,i)=>{

    const o = se[i];

    let v =
      o.tagName === 'SELECT'
        ? o.options[o.selectedIndex].text
        : o.value;

    if(
      o.type === 'date' &&
      v
    ){

      const p =
        v.split('-');

      v =
        p[2] +
        '/' +
        p[1] +
        '/' +
        p[0];

    }

    const d =
      document.createElement('div');

    const multi =
      o.tagName === 'TEXTAREA';

    const sel =
      o.tagName === 'SELECT';

    const long =
      /\S{22,}/.test(v);

    d.textContent = v;

    d.style.cssText =
      'border:1px solid #dde2cf;' +
      'border-radius:6px;' +
      'padding:6px 8px;' +
      'background:#f6f8ef;' +
      'color:#1a1d18;' +
      'font:inherit;' +
      'overflow:hidden;' +
      'white-space:pre-wrap;' +
      'overflow-wrap:break-word;' +
      (
        sel
          ? 'width:80px;'
          : 'width:100%;'
      ) +
      (
        long
          ? 'word-break:break-all;'
          : ''
      ) +
      'min-height:' +
      (
        multi
          ? 56
          : sel
            ? 34
            : o.offsetHeight
      ) +
      'px;' +
      (
        multi
          ? ''
          : 'display:flex;' +
            'align-items:center;'
      );

    el.replaceWith(d);

  });

  c.querySelectorAll(
    '.x,.nopdf'
  ).forEach(e=>e.remove());

  const q =
    c.querySelector('#qr');

  const cap =
    c.querySelector('#qrcap');

  if(q){

    q.innerHTML = '';

    const w =
      qrDom();

    if(w){

      q.appendChild(w);

      q.style.cssText =
        'display:inline-block;' +
        'background:#fff;' +
        'padding:12px;' +
        'border:1px solid #dde2cf;' +
        'border-radius:8px;' +
        'margin-top:10px';

    }

  }

  if(cap){

    cap.style.color =
      '#6b7160';

    cap.style.textAlign =
      'center';

  }

  const nr =
    c.querySelector('.nrow');

  const nt =
    c.querySelector('.nt');

  const qb =
    c.querySelector('.qrbox');

  if(
    nr &&
    nt &&
    qb
  ){

    nr.style.cssText =
      'display:flex;' +
      'gap:18px;' +
      'align-items:flex-end';

    nt.style.cssText =
      'flex:1;' +
      'min-width:0';

    qb.style.cssText =
      'flex:none;' +
      'text-align:center';

  }

  c.querySelectorAll('[id]')
    .forEach(e =>
      e.removeAttribute('id')
    );

  c.style.borderRadius = '0';

  c.style.borderTop =
    '8px solid #b6e36b';

  c.style.minHeight =
    Math.round(
      W * 297 / 210
    ) + 'px';

  return c;

}


/* =========================
   CREATE PDF
========================= */

async function makePdf(){

  const W =
    document.querySelector(
      '.paper'
    ).offsetWidth;

  const c =
    cloneForPdf(W);

  const host =
    document.createElement('div');

  host.style.cssText =
    'position:fixed;' +
    'left:-99999px;' +
    'top:0;' +
    'background:#fff;' +
    'width:' + W + 'px;';

  host.appendChild(c);

  document.body.appendChild(host);

  try{

    return await html2pdf()
      .set({
        margin:0,

        image:{
          type:'jpeg',
          quality:.95
        },

        html2canvas:{
          scale:2,
          backgroundColor:'#ffffff',
          useCORS:true,
          logging:false
        },

        jsPDF:{
          unit:'mm',
          format:'a4',
          orientation:'portrait'
        },

        pagebreak:{
          mode:[
            'avoid-all',
            'css',
            'legacy'
          ]
        }

      })
      .from(c)
      .outputPdf('blob');

  }finally{

    host.remove();

  }

}


/* =========================
   RELIABLE PDF DOWNLOAD
========================= */

async function downloadPdfBlob(blob,name){

  if(
    window.showSaveFilePicker
  ){

    try{

      const handle =
        await window.showSaveFilePicker({

          suggestedName:name,

          types:[
            {
              description:'PDF document',
              accept:{
                'application/pdf':['.pdf']
              }
            }
          ]

        });

      const writable =
        await handle.createWritable();

      await writable.write(blob);
      await writable.close();

      return 'saved';

    }catch(e){

      if(
        e &&
        e.name === 'AbortError'
      ){
        return 'cancelled';
      }

    }

  }

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;
  a.download = name;
  a.rel = 'noopener';

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },10000);

  return 'downloaded';

}


/* =========================
   SAVE PDF
========================= */

async function savePdf(){

  if(
    typeof html2pdf === 'undefined'
  ){

    toast(
      'PDF tool load nahi hua, internet check karo'
    );

    return;

  }

  const o =
    readForm();

  if(!o.no){

    toast(
      'Invoice number aur client name daalo'
    );

    return;

  }

  if(!o.cname){

    toast(
      'Invoice number aur client name daalo'
    );

    return;

  }

  toast('PDF ban rahi hai...');

  saveInvoice();

  let blob;

  try{

    blob =
      await makePdf();

  }catch(e){

    console.error(
      'PDF generation error:',
      e
    );

    toast(
      'PDF nahi bani, dobara try karo'
    );

    return;

  }

  const safeClient =
    o.cname
      .replace(/[^\w\-]+/g,'_')
      .replace(/^_+|_+$/g,'');

  const safeInvoice =
    o.no
      .replace(/[^\w\-]+/g,'_')
      .replace(/^_+|_+$/g,'');

  const name =
    (
      safeInvoice ||
      'ShortBamboo-Invoice'
    ) +
    (
      safeClient
        ? '_' + safeClient
        : ''
    ) +
    '.pdf';

  if(
    !window.showSaveFilePicker &&
    navigator.canShare &&
    navigator.share
  ){

    try{

      const file =
        new File(
          [blob],
          name,
          {
            type:'application/pdf'
          }
        );

      if(
        navigator.canShare({
          files:[file]
        })
      ){

        await navigator.share({
          files:[file],
          title:name
        });

        toast(
          'PDF ready hai'
        );

        return;

      }

    }catch(e){

      if(
        e &&
        e.name === 'AbortError'
      ){
        return;
      }

      console.warn(
        'Share failed, falling back to download',
        e
      );

    }

  }

  try{

    const result =
      await downloadPdfBlob(
        blob,
        name
      );

    if(result === 'cancelled'){
      return;
    }

    toast(
      'PDF save ho gayi'
    );

  }catch(e){

    console.error(
      'Download failed:',
      e
    );

    try{

      const url =
        URL.createObjectURL(blob);

      window.open(
        url,
        '_blank',
        'noopener'
      );

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },60000);

      toast(
        'PDF open ho gayi — wahan se save kar lo'
      );

    }catch(err){

      console.error(err);

      toast(
        'PDF save nahi ho paayi'
      );

    }

  }

}
